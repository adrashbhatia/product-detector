<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Scanner — Product Detector</title>
<style>
  :root{
    --bg: #12151A;
    --surface: #1B2027;
    --surface-2: #232A33;
    --line: #2E3640;
    --text: #EDEBE4;
    --text-muted: #8A93A0;
    --amber: #E8A33D;
    --amber-dim: #6b551f;
    --teal: #4FA88F;
    --danger: #D9704F;
    --mono: ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace;
    --sans: -apple-system, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
  }

  .wrap{
    max-width: 960px;
    margin: 0 auto;
    padding: 48px 24px 96px;
  }

  header{
    display:flex;
    align-items:baseline;
    justify-content: space-between;
    margin-bottom: 40px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 20px;
  }

  h1{
    font-size: 22px;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
  }

  h1 span{ color: var(--amber); }

  header p{
    margin:0;
    color: var(--text-muted);
    font-size: 13px;
    font-family: var(--mono);
  }

  .dropzone{
    position: relative;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--surface);
    padding: 64px 24px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .dropzone:hover, .dropzone.drag{
    border-color: var(--amber);
    background: var(--surface-2);
  }

  .dropzone .big{
    font-size: 17px;
    margin-bottom: 6px;
  }

  .dropzone .small{
    font-size: 13px;
    color: var(--text-muted);
    font-family: var(--mono);
  }

  .dropzone input{ display:none; }

  .stage{
    margin-top: 28px;
    display:none;
  }

  .stage.active{ display:grid; grid-template-columns: 1.4fr 1fr; gap: 20px; }

  @media (max-width: 720px){
    .stage.active{ grid-template-columns: 1fr; }
  }

  .canvas-panel{
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--surface);
    padding: 12px;
    position: relative;
    overflow:hidden;
  }

  .canvas-panel canvas{
    width: 100%;
    height: auto;
    display:block;
    border-radius: 2px;
  }

  .scanline{
    position:absolute;
    left:0; right:0; top:0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--amber), transparent);
    box-shadow: 0 0 12px 2px var(--amber);
    animation: sweep 1.1s ease-in-out infinite;
    opacity: 0;
    pointer-events:none;
  }

  .scanline.active{ opacity: 1; }

  @keyframes sweep{
    0%{ top: 4%; }
    50%{ top: 92%; }
    100%{ top: 4%; }
  }

  .results{
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--surface);
    padding: 18px;
    display:flex;
    flex-direction:column;
  }

  .results h2{
    font-size: 13px;
    text-transform: none;
    color: var(--text-muted);
    margin: 0 0 4px;
    font-weight: 500;
  }

  .results .meta{
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 16px;
  }

  .det-list{
    list-style:none;
    margin:0; padding:0;
    display:flex;
    flex-direction:column;
    gap: 10px;
    max-height: 420px;
    overflow-y:auto;
  }

  .det-item{
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 12px;
    background: var(--surface-2);
    border-radius: 3px;
    border-left: 3px solid var(--amber);
  }

  .det-item .label{
    font-size: 14px;
    text-transform: capitalize;
  }

  .det-item .conf{
    font-family: var(--mono);
    font-size: 12px;
    color: var(--teal);
  }

  .empty-state, .error-state{
    color: var(--text-muted);
    font-size: 13px;
    font-family: var(--mono);
    padding: 20px 0;
  }

  .error-state{ color: var(--danger); }

  .reset-btn{
    margin-top: 16px;
    align-self: flex-start;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text-muted);
    font-family: var(--sans);
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 3px;
    cursor: pointer;
  }

  .reset-btn:hover{ border-color: var(--amber); color: var(--text); }

  footer{
    margin-top: 48px;
    color: var(--text-muted);
    font-size: 12px;
    font-family: var(--mono);
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>scan<span>.</span>detect</h1>
    <p>product / item detector</p>
  </header>

  <div class="dropzone" id="dropzone">
    <div class="big">Drop an image here, or click to upload</div>
    <div class="small">JPEG · PNG · WEBP — up to 10MB</div>
    <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" />
  </div>

  <div class="stage" id="stage">
    <div class="canvas-panel">
      <div class="scanline" id="scanline"></div>
      <canvas id="canvas"></canvas>
    </div>

    <div class="results">
      <h2>Detected items</h2>
      <div class="meta" id="meta">—</div>
      <div id="resultsBody">
        <div class="empty-state">Waiting for image…</div>
      </div>
      <button class="reset-btn" id="resetBtn">Scan another image</button>
    </div>
  </div>

  <footer>YOLOv8n · runs on the server, results are not stored</footer>
</div>

<script>
const API_URL = "/api/detect";

const dropzone = document.getElementById("dropzone");
const fileInput = document.getElementById("fileInput");
const stage = document.getElementById("stage");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const scanline = document.getElementById("scanline");
const resultsBody = document.getElementById("resultsBody");
const meta = document.getElementById("meta");
const resetBtn = document.getElementById("resetBtn");

const palette = ["#E8A33D", "#4FA88F", "#D9704F", "#7C9CBF", "#C77DBF", "#8AC24A"];

dropzone.addEventListener("click", () => fileInput.click());
dropzone.addEventListener("dragover", (e) => { e.preventDefault(); dropzone.classList.add("drag"); });
dropzone.addEventListener("dragleave", () => dropzone.classList.remove("drag"));
dropzone.addEventListener("drop", (e) => {
  e.preventDefault();
  dropzone.classList.remove("drag");
  if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener("change", (e) => {
  if (e.target.files.length) handleFile(e.target.files[0]);
});
resetBtn.addEventListener("click", () => {
  stage.classList.remove("active");
  fileInput.value = "";
});

function handleFile(file){
  stage.classList.add("active");
  resultsBody.innerHTML = '<div class="empty-state">Scanning…</div>';
  meta.textContent = "—";
  scanline.classList.add("active");

  const img = new Image();
  const reader = new FileReader();
  reader.onload = (e) => {
    img.onload = () => {
      canvas.width = img.width;
      canvas.height = img.height;
      ctx.drawImage(img, 0, 0);
      runDetection(file, img);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

async function runDetection(file, img){
  const formData = new FormData();
  formData.append("file", file);

  try{
    const res = await fetch(API_URL, { method: "POST", body: formData });
    if (!res.ok){
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || `Request failed (${res.status})`);
    }
    const data = await res.json();
    scanline.classList.remove("active");
    renderResults(data, img);
  } catch(err){
    scanline.classList.remove("active");
    resultsBody.innerHTML = `<div class="error-state">${escapeHtml(err.message)}</div>`;
    meta.textContent = "—";
  }
}

function renderResults(data, img){
  ctx.drawImage(img, 0, 0);
  meta.textContent = `${data.count} item${data.count === 1 ? "" : "s"} · ${data.inference_time_ms}ms`;

  if (!data.detections.length){
    resultsBody.innerHTML = '<div class="empty-state">No items detected. Try a clearer or closer shot.</div>';
    return;
  }

  const list = document.createElement("ul");
  list.className = "det-list";

  data.detections.forEach((d, i) => {
    const color = palette[i % palette.length];
    const { x1, y1, x2, y2 } = d.box;

    ctx.strokeStyle = color;
    ctx.lineWidth = Math.max(2, img.width * 0.003);
    ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);

    ctx.font = `${Math.max(14, img.width * 0.02)}px sans-serif`;
    const label = `${d.label} ${(d.confidence * 100).toFixed(0)}%`;
    const textW = ctx.measureText(label).width + 12;
    const textH = Math.max(20, img.width * 0.028);
    ctx.fillStyle = color;
    ctx.fillRect(x1, Math.max(0, y1 - textH), textW, textH);
    ctx.fillStyle = "#12151A";
    ctx.fillText(label, x1 + 6, Math.max(textH - 6, y1 - 6));

    const li = document.createElement("li");
    li.className = "det-item";
    li.style.borderLeftColor = color;
    li.innerHTML = `<span class="label">${escapeHtml(d.label)}</span><span class="conf">${(d.confidence * 100).toFixed(1)}%</span>`;
    list.appendChild(li);
  });

  resultsBody.innerHTML = "";
  resultsBody.appendChild(list);
}

function escapeHtml(str){
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}
</script>
</body>
</html>
